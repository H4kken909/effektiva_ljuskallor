[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
extend-exclude = [".pytest-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF059", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]
[tool.ruff.format]
# Adrians filer och konstfilen formateras inte (KOD-14).
exclude = ["tests/test_calc.py", "tests/test_files.py", "testprotokoll/**", "startskarm/prisma.py"]
